  <div>

    <div class="container">

    <div class="container">

    <div class="container">

          <h4 class=" border border-success bg-success-subtle text-success rounded-2 scale-up-hor-center" id="survey8a">

    <div class="container" id="containerinput">
      <div class="row">
        <div class="col-2"></div>
        <div class="col-4">
          <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="Masukkan Tebakan" aria-label="Recipient's username"
              aria-describedby="button-addon2" id="inputsurvey">
            <button class="btn btn-outline-success" type="submit" id="button-addon2" onclick="survey()">Button</button>
          </div>
        </div>
        <div class="col-2"></div>
        <div class="col-2 d-flex justify-content-center align-items-center border border-success border-2 rounded"
          id="poin">0</div>
      </div>
    </div>
    <div class="container">
      <div class="row">
        <div class="col-8" id="containersalah">
          <h3 class=" border border-danger bg-danger-subtle text-danger text-center scale-up-hor-center rounded-2"
            id="salah">JAWABAN SALAH
            <img src="images/close.png" alt="" class="close" id="tutup" onclick="ilang()">
          </h3>
        </div>
      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>
  <script>
    let survey1a = document.getElementById('survey1a')
    let survey2a = document.getElementById('survey2a')
    let survey3a = document.getElementById('survey3a')
    let survey4a = document.getElementById('survey4a')
    let survey5a = document.getElementById('survey5a')
    let survey6a = document.getElementById('survey6a')
    let survey7a = document.getElementById('survey7a')
    let survey8a = document.getElementById('survey8a')
    let survey1b = document.getElementById('survey1b')
    let survey2b = document.getElementById('survey2b')
    let survey3b = document.getElementById('survey3b')
    let survey4b = document.getElementById('survey4b')
    let survey5b = document.getElementById('survey5b')
    let survey6b = document.getElementById('survey6b')
    let survey7b = document.getElementById('survey7b')
    let survey8b = document.getElementById('survey8b')
    let inputsurveyB = document.getElementById('inputsurvey')
    let poin = document.getElementById('poin')
    let salah = document.getElementById('salah')
    let tutup = document.getElementById('tutup')
    i = e = b = c = d = f = g = h = 0
    survey1a.style.display = "none"
    survey2a.style.display = "none"
    survey3a.style.display = "none"
    survey4a.style.display = "none"
    survey5a.style.display = "none"
    survey6a.style.display = "none"
    survey7a.style.display = "none"
    survey8a.style.display = "none"
    salah.style.display = "none"
    nilaiAwal = poin.innerHTML
    a = +(nilaiAwal)
    function tambah(a, b) {
      return a + b
    }
    function playwrong() {
      var audio = new Audio('audio/wrong.mp3');
      audio.play().catch(function(err) { console.warn(err); });
    }
    function playcorrect() {
      var audio = new Audio('audio/correct.mp3');
      audio.play().catch(function(err) { console.warn(err); });
    }
    if (inputsurveyB) {
      inputsurveyB.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          survey();
        }
      });
    }
    function survey() {
      let inp = document.getElementById('inputsurvey') || inputsurveyB;
      inputsurveyA = (inp ? inp.value : '').trim().toUpperCase()
      if (inputsurveyA == "PLANING BUKBER LAGI" && i == 0) {
        playcorrect()
        i++
        survey1a.style.display = "block"
        survey1b.style.display = "none"
        salah.style.display = "none"
        poinAkhir = tambah(a, 75)
        poin.innerHTML = poinAkhir
        return a = poinAkhir
      } else if (inputsurveyA == "MABAR" && e == 0) {
        playcorrect()
        e++
        survey2a.style.display = "block"
        survey2b.style.display = "none"
        salah.style.display = "none"
        poinAkhir = tambah(a, 60)
        poin.innerHTML = poinAkhir
        return a = poinAkhir
      } else if (inputsurveyA == "GAK SHOLAT MAGHRIB" && b == 0) {
        playcorrect()
        b++
        survey3a.style.display = "block"
        survey3b.style.display = "none"
        salah.style.display = "none"
        poinAkhir = tambah(a, 50)
        poin.innerHTML = poinAkhir
        return a = poinAkhir
      } else if (inputsurveyA == "ARISAN" && c == 0) {
        playcorrect()
        c++
        survey4a.style.display = "block"
        survey4b.style.display = "none"
        salah.style.display = "none"
        poinAkhir = tambah(a, 45)
        poin.innerHTML = poinAkhir
        return a = poinAkhir
      } else if (inputsurveyA == "REUNI" && d == 0) {
        playcorrect()
        d++
        survey5a.style.display = "block"
        survey5b.style.display = "none"
        salah.style.display = "none"
        poinAkhir = tambah(a, 35)
        poin.innerHTML = poinAkhir
        return a = poinAkhir
      }
      else if (inputsurveyA == "VELOCITY AN" && f == 0) {
        playcorrect()
        f++
        survey6a.style.display = "block"
        survey6b.style.display = "none"
        salah.style.display = "none"
        poinAkhir = tambah(a, 25)
        poin.innerHTML = poinAkhir
        return a = poinAkhir
      }
      else if (inputsurveyA == "SELFIE" && g == 0) {
        playcorrect()
        g++
        survey7a.style.display = "block"
        survey7b.style.display = "none"
        salah.style.display = "none"
        poinAkhir = tambah(a, 15)
        poin.innerHTML = poinAkhir
        return a = poinAkhir
      }
      else if (inputsurveyA == "DATENG TELAT" && h == 0) {
        playcorrect()
        h++
        survey8a.style.display = "block"
        survey8b.style.display = "none"
        salah.style.display = "none"
        poinAkhir = tambah(a, 8)
        poin.innerHTML = poinAkhir
        return a = poinAkhir
      }

      else {
        salah.style.display = "block"
        playwrong()
      }
    }
    function ilang() {
      salah.style.display = "none"
    } 
  </script>
</body>
