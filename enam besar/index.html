  <script>
    const defaultConfig = {
      brand_name: "BrandName",
      cta_text: "Get Started",
      background_color: "#667eea",
      navbar_glass_bg: "rgba(255, 255, 255, 0.1)",
      text_color: "#ffffff",
      button_bg_color: "#ffffff",
      button_text_color: "#667eea"
    };

    async function onConfigChange(config) {
      const brandName = config.brand_name || defaultConfig.brand_name;
      const ctaText = config.cta_text || defaultConfig.cta_text;
      const bgColor = config.background_color || defaultConfig.background_color;
      const navbarGlassBg = config.navbar_glass_bg || defaultConfig.navbar_glass_bg;
      const textColor = config.text_color || defaultConfig.text_color;
      const buttonBg = config.button_bg_color || defaultConfig.button_bg_color;
      const buttonText = config.button_text_color || defaultConfig.button_text_color;

      document.getElementById('brand-name').textContent = brandName;
      document.getElementById('cta-button').textContent = ctaText;

      document.body.style.background = `linear-gradient(135deg, ${bgColor} 0%, #764ba2 100%)`;

      const navbar = document.querySelector('.nav-bar');
      navbar.style.background = navbarGlassBg;

      const allText = document.querySelectorAll('.brand-name, .nav-links a');
      allText.forEach(el => {
        el.style.color = textColor;
      });

      const button = document.querySelector('.cta-button');
      button.style.background = buttonBg;
      button.style.color = buttonText;
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => {
              config.background_color = value;
              window.elementSdk.setConfig({ background_color: value });
            }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => {
              config.text_color = value;
              window.elementSdk.setConfig({ text_color: value });
            }
          },
          {
            get: () => config.button_bg_color || defaultConfig.button_bg_color,
            set: (value) => {
              config.button_bg_color = value;
              window.elementSdk.setConfig({ button_bg_color: value });
            }
          },
          {
            get: () => config.button_text_color || defaultConfig.button_text_color,
            set: (value) => {
              config.button_text_color = value;
              window.elementSdk.setConfig({ button_text_color: value });
            }
          }
        ],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ["brand_name", config.brand_name || defaultConfig.brand_name],
        ["cta_text", config.cta_text || defaultConfig.cta_text]
      ]);
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }
  </script>
